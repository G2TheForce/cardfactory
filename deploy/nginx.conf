# /etc/nginx/sites-available/smartcard-studio
# Replace cards.example.com and the paths, then:
#   ln -s /etc/nginx/sites-available/smartcard-studio /etc/nginx/sites-enabled/
#   certbot --nginx -d cards.example.com   (adds the TLS server block)
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name cards.example.com;
    root /var/www/smartcard-studio/current/public;
    index index.php;
    charset utf-8;

    # Spreadsheet uploads (bulk generator) and images; keep in step with PHP's
    # upload_max_filesize / post_max_size (12M is enough for the defaults).
    client_max_body_size 12M;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fingerprinted Vite assets and public uploads can be cached for a long time.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /storage/ {
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        # Uploaded files are data, never code.
        location ~ \.php$ { return 404; }
    }

    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Exports and bulk uploads can take a while on large files.
        fastcgi_read_timeout 120s;
    }

    # Nothing else that ends in .php, and no dotfiles (.env, .git).
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
