; /etc/supervisor/conf.d/smartcard-studio.conf
; supervisorctl reread && supervisorctl update && supervisorctl start smartcard-worker:*
;
; Exports and bulk runs go to the "exports" queue and can run for up to an hour,
; so --timeout matches the job timeout (3600 s). Keep DB_QUEUE_RETRY_AFTER (or
; REDIS_QUEUE_RETRY_AFTER) above it, default 3700. stopwaitsecs lets a running
; export finish during a deploy restart.

[program:smartcard-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/smartcard-studio/current/artisan queue:work --queue=exports,default --sleep=3 --tries=1 --timeout=3600 --max-time=21600
directory=/var/www/smartcard-studio/current
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3610
redirect_stderr=true
stdout_logfile=/var/www/smartcard-studio/shared/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
